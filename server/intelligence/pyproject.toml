[project]
name = "mensetsu-intelligence"
version = "0.1.0"
description = "AI and research engine for Mensetsu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "openai>=3.22.1",
    "pyyaml>=6.0.2",
    "langgraph>=1.2.0",
    "langchain>=1.4.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-redis==0.5.2",
    "redis>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
