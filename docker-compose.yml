services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    container_name: mensetsu-surrealdb
    command: start --log debug --user root --pass root surrealkv:/data/surreal.db
    user: "0:0"
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: mensetsu-redis
    environment:
      - REDIS_ARGS=--maxmemory 3gb --maxmemory-policy volatile-lru
    mem_limit: 3584m
    cpus: 1.5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:2026.10.11-ad46ebd7d
    container_name: mensetsu-searxng
    mem_limit: 384m
    cpus: 1.0
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    container_name: mensetsu-api
    build:
      context: .
      dockerfile: server/api/Dockerfile
    expose:
      - "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 6
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=mensetsu
      - SURREAL_DB=production
      - INTELLIGENCE_GRPC_ENDPOINT=http://intelligence:50051
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001
      - RUST_LOG=info,tower_http=info
    depends_on:
      surrealdb:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  intelligence:
    container_name: mensetsu-intelligence
    build:
      context: ./server/intelligence
      dockerfile: Dockerfile
    expose:
      - "50051"
    env_file:
      - .env
    environment:
      - INTELLIGENCE_PORT=50051
      - INTELLIGENCE_HOST=0.0.0.0
      - SURREAL_ENDPOINT=http://surrealdb:8000
      - REDIS_URL=redis://redis:6379
      - CHECKPOINT_TTL_MINUTES=180
      - SEARXNG_URL=http://searxng:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; c=grpc.insecure_channel('127.0.0.1:50051'); grpc.channel_ready_future(c).result(timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  worker:
    container_name: mensetsu-worker
    build:
      context: ./server/intelligence
      dockerfile: Dockerfile
    command: ["python", "-m", "src.worker"]
    env_file:
      - .env
    environment:
      - SURREAL_ENDPOINT=http://surrealdb:8000
      - REDIS_URL=redis://redis:6379
      - CHECKPOINT_TTL_MINUTES=180
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
    container_name: mensetsu-web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - NUXT_API_BASE_SERVER=http://api:3000
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

volumes:
  surreal_data:
  redis_data:
