services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    container_name: mensetsu-surrealdb
    command: start --log info --user root --pass root surrealkv:/data/surreal.db
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    user: "0:0"
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: mensetsu-redis
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - REDIS_ARGS=--maxmemory 3gb --maxmemory-policy volatile-lru
    mem_limit: 3584m
    cpus: 1.5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:2026.10.11-ad46ebd7d
    container_name: mensetsu-searxng
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    mem_limit: 384m
    cpus: 1.0
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: mensetsu-minio
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - MINIO_API_CORS_ALLOW_ORIGIN=${S3_CORS_ORIGIN:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:3003}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: mensetsu-minio-init
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-mensetsu-resumes}
    volumes:
      - ./infra/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"

  api:
    container_name: mensetsu-api
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: server/api/Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 6
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=mensetsu
      - SURREAL_DB=production
      - INTELLIGENCE_GRPC_ENDPOINT=http://intelligence:50051
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001
      - API_GRPC_BIND=0.0.0.0:50052
      - S3_BUCKET=${S3_BUCKET:-mensetsu-resumes}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_ENDPOINT_INTERNAL=http://minio:9000
      - S3_ENDPOINT_PUBLIC=${S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - RUST_LOG=info,tower_http=info
    expose:
      - "3000"
      - "50052"
    depends_on:
      surrealdb:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
  intelligence:
    container_name: mensetsu-intelligence
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ./server/intelligence
      dockerfile: Dockerfile
      target: intelligence
    expose:
      - "50051"
    env_file:
      - .env
    environment:
      - INTELLIGENCE_PORT=50051
      - INTELLIGENCE_HOST=0.0.0.0
      - SURREAL_ENDPOINT=http://surrealdb:8000
      - REDIS_URL=redis://redis:6379
      - CHECKPOINT_TTL_MINUTES=180
      - SEARXNG_URL=http://searxng:8080
      - API_GRPC_ENDPOINT=http://api:50052
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - S3_DOWNLOAD_ALLOWED_ORIGIN=http://minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; c=grpc.insecure_channel('127.0.0.1:50051'); grpc.channel_ready_future(c).result(timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  worker:
    container_name: mensetsu-worker
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: ./server/intelligence
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      - SURREAL_ENDPOINT=http://surrealdb:8000
      - REDIS_URL=redis://redis:6379
      - CHECKPOINT_TTL_MINUTES=180
      - SEARXNG_URL=http://searxng:8080
      - API_GRPC_ENDPOINT=http://api:50052
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - S3_DOWNLOAD_ALLOWED_ORIGIN=http://minio:9000
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
    container_name: mensetsu-web
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - NUXT_API_BASE_SERVER=http://api:3000
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

volumes:
  surreal_data:
  redis_data:
  minio_data:
