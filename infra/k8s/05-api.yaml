apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mensetsu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: mensetsu/api:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: mensetsu-config
            - secretRef:
                name: mensetsu-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mensetsu
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: api
