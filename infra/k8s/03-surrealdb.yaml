apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surrealdb
  namespace: mensetsu
spec:
  serviceName: surrealdb
  replicas: 1
  selector:
    matchLabels:
      app: surrealdb
  template:
    metadata:
      labels:
        app: surrealdb
    spec:
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:v3.2.4
          command:
            - start
            - --log
            - info
            - --user
            - root
            - --pass
            - root
            - surrealkv:/data/surreal.db
          ports:
            - containerPort: 8000
              name: http-ws
          volumeMounts:
            - name: surreal-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /surreal
                - is-ready
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /surreal
                - is-ready
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: surreal-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
  namespace: mensetsu
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http-ws
  selector:
    app: surrealdb
