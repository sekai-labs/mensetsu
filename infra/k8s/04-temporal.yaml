apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: mensetsu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/admin-tools:latest
          command:
            - temporal
            - server
            - start-dev
            - --ip
            - 0.0.0.0
          ports:
            - containerPort: 7233
              name: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: mensetsu
spec:
  ports:
    - port: 7233
      targetPort: 7233
      name: grpc
  selector:
    app: temporal
