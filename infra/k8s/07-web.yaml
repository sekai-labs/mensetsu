apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mensetsu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: mensetsu/web:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: mensetsu-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mensetsu
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: web
