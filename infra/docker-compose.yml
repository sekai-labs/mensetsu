services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    container_name: mensetsu-surrealdb
    command: start --log debug --user root --pass root surrealkv:/data/surreal.db
    ports:
      - "8000:8000"
    volumes:
      - surreal_data:/data
    restart: unless-stopped

  temporal:
    image: temporalio/admin-tools:latest
    container_name: mensetsu-temporal-admin
    depends_on:
      - temporal-server
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
    stdin_open: true
    tty: true

  temporal-server:
    image: temporalio/auto-setup:latest
    container_name: mensetsu-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - SQLITE_DB_DIR=/etc/temporal/sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sqlite.yaml
    volumes:
      - temporal_data:/etc/temporal/sqlite

  temporal-ui:
    image: temporalio/ui:latest
    container_name: mensetsu-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    depends_on:
      - temporal-server

volumes:
  surreal_data:
  temporal_data:
