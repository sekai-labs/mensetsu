use_default_settings:
  engines:
    keep_only:
      - bing
      - github
      - yahoo
general:
  debug: false
  instance_name: "Mensetsu SearXNG"
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
search:
  safe_search: 0
  formats:
    - html
    - json
outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
engines:
  - name: bing
    engine: bing
    disabled: false
  - name: github
    engine: github
    disabled: false
  - name: yahoo
    engine: yahoo
    disabled: false
