[package]
name = "mensetsu-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Sekai Labs"]
description = "Mensetsu Desktop Client built with Dioxus"

[dependencies]
dioxus = { version = "0.6.3", features = ["desktop"] }
tokio = { version = "1.44", features = ["fs", "macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
thiserror = "2.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5.0.1"
rfd = "0.17"
mensetsu_contracts = { path = "../../contracts/native/rust" }

[dev-dependencies]
tempfile = "3.10"
