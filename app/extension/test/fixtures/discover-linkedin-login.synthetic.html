<!doctype html>
<html>
<head><title>Sign in | LinkedIn</title></head>
<body>
<section id="synthetic-guest-signin">
  <h1>Sign in</h1>
  <p>Sign in to apply for jobs and to view job details.</p>
  <input autocomplete="username" id="session_key" name="session_key" type="text">
  <input autocomplete="current-password" id="session_password" name="session_password" type="password">
  <button type="button">Sign in</button>
</section>
</body>
</html>
