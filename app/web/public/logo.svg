<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate & Indigo -->
    <linearGradient id="m-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Indigo/Violet Gradient -->
    <linearGradient id="m-accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Precision Emerald Accent -->
    <linearGradient id="m-emerald-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Corner mask for squircle -->
    <clipPath id="squircle-clip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle-clip)">
    <!-- Squircle Canvas Base -->
    <rect width="512" height="512" fill="url(#m-bg-gradient)" />

    <!-- Subtle Technical Background Grid Lines -->
    <g stroke="#334155" stroke-width="1" opacity="0.25">
      <line x1="64" y1="0" x2="64" y2="512" />
      <line x1="128" y1="0" x2="128" y2="512" />
      <line x1="192" y1="0" x2="192" y2="512" />
      <line x1="256" y1="0" x2="256" y2="512" stroke-dasharray="4 4" opacity="0.4" />
      <line x1="320" y1="0" x2="320" y2="512" />
      <line x1="384" y1="0" x2="384" y2="512" />
      <line x1="448" y1="0" x2="448" y2="512" />

      <line x1="0" y1="64" x2="512" y2="64" />
      <line x1="0" y1="128" x2="512" y2="128" />
      <line x1="0" y1="192" x2="512" y2="192" />
      <line x1="0" y1="256" x2="512" y2="256" stroke-dasharray="4 4" opacity="0.4" />
      <line x1="0" y1="320" x2="512" y2="320" />
      <line x1="0" y1="384" x2="512" y2="384" />
      <line x1="0" y1="448" x2="512" y2="448" />
    </g>

    <!-- Outer Border Inset -->
    <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="none" stroke="#4F46E5" stroke-width="2" opacity="0.3" />

    <!-- Technical Glyph Frame: Precision Hexagon / Diamond Structure -->
    <polygon points="256,68 436,172 436,380 256,484 76,380 76,172" fill="#1E293B" fill-opacity="0.5" stroke="#6366F1" stroke-width="3" stroke-opacity="0.4" />

    <!-- Connected Knowledge Graph Edges -->
    <g stroke="url(#m-accent-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <!-- Cross connections between nodes -->
      <line x1="256" y1="120" x2="136" y2="216" />
      <line x1="256" y1="120" x2="376" y2="216" />
      <line x1="136" y1="216" x2="186" y2="368" />
      <line x1="376" y1="216" x2="326" y2="368" />
      <line x1="186" y1="368" x2="326" y2="368" />
      <line x1="136" y1="216" x2="376" y2="216" stroke-dasharray="6 6" stroke-width="2" opacity="0.6" />
      <line x1="256" y1="120" x2="256" y2="276" />
    </g>

    <!-- Center Monogram: Architected Kanji "面" (Face / Surface / Interview) -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer Kanji Shield (面 top & box) -->
      <path d="M 160 176 L 352 176" stroke-width="20" stroke="url(#m-accent-gradient)" />
      <path d="M 176 176 L 176 368 L 336 368 L 336 176" stroke-width="18" stroke="#FFFFFF" />
      <!-- Center vertical divider -->
      <path d="M 256 176 L 256 368" stroke-width="16" stroke="#FFFFFF" />
      <!-- Horizontal crossbars -->
      <path d="M 176 240 L 336 240" stroke-width="14" stroke="#CBD5E1" />
      <path d="M 176 304 L 336 304" stroke-width="14" stroke="#CBD5E1" />
      <!-- Top slanting accents of 面 -->
      <path d="M 224 136 L 200 176" stroke-width="16" stroke="#818CF8" />
      <path d="M 288 136 L 312 176" stroke-width="16" stroke="#818CF8" />
    </g>

    <!-- Top Apex Node (Verified Proof Point) -->
    <circle cx="256" cy="120" r="14" fill="#10B981" filter="url(#m-glow)" />
    <circle cx="256" cy="120" r="8" fill="#FFFFFF" />

    <!-- Left & Right Nodes (Telemetry & Architecture) -->
    <circle cx="136" cy="216" r="12" fill="#6366F1" />
    <circle cx="136" cy="216" r="6" fill="#FFFFFF" />

    <circle cx="376" cy="216" r="12" fill="#6366F1" />
    <circle cx="376" cy="216" r="6" fill="#FFFFFF" />

    <!-- Bottom Verification Nodes -->
    <circle cx="186" cy="368" r="12" fill="#8B5CF6" />
    <circle cx="186" cy="368" r="6" fill="#FFFFFF" />

    <circle cx="326" cy="368" r="14" fill="#3B82F6" />
    <circle cx="326" cy="368" r="7" fill="#FFFFFF" />

    <!-- Center Core Proof Ring -->
    <circle cx="256" cy="272" r="18" fill="#4F46E5" />
    <circle cx="256" cy="272" r="10" fill="#34D399" />
    <circle cx="256" cy="272" r="4" fill="#FFFFFF" />
  </g>
</svg>
