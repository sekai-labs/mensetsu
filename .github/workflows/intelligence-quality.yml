name: Intelligence quality

on:
  push:
    paths:
      - "server/intelligence/**"
      - ".github/workflows/intelligence-quality.yml"
  pull_request:
    paths:
      - "server/intelligence/**"
      - ".github/workflows/intelligence-quality.yml"

permissions:
  contents: read

concurrency:
  group: intelligence-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/intelligence
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --frozen --group dev
      - name: Lint intelligence service
        run: uv run ruff check .
      - name: Run offline output quality checks
        run: uv run pytest quality_checks -q
