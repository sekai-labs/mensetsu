name: Container Images

on:
  create:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: server/api/Dockerfile
            target: ""
          - image: intelligence
            context: server/intelligence
            file: server/intelligence/Dockerfile
            target: intelligence
          - image: worker
            context: server/intelligence
            file: server/intelligence/Dockerfile
            target: worker
          - image: web
            context: .
            file: app/web/Dockerfile
            target: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image-name
        run: |
          REPO_LOWER="$(printf '%s' "$GITHUB_REPOSITORY" |
            tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${REPO_LOWER}-${{ matrix.image }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
