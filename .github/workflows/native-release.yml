name: Native client release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libsecret-1-dev \
            libglib2.0-dev pkg-config
      - name: Build Linux desktop client
        run: cargo build --release --manifest-path app/desktop/linux/Cargo.toml
      - name: Package Linux client
        run: |
          mkdir -p release-assets
          tar -czf release-assets/mensetsu-linux-x86_64.tar.gz \
            -C app/desktop/linux/target/release mensetsu-linux
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: release-assets/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Publish self-contained Windows desktop client
        shell: pwsh
        run: |
          $publishDir = (New-Item -ItemType Directory `
            -Force -Path release-assets/windows).FullName
          msbuild app/desktop/windows/src/Mensetsu/Mensetsu.csproj `
            /restore /target:Publish `
            /p:Platform=x64 /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            "/p:PublishDir=$publishDir/"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path (Join-Path $publishDir 'Mensetsu.exe'))) {
            throw 'WinUI executable was not published'
          }
          if (-not (Test-Path (Join-Path $publishDir 'coreclr.dll'))) {
            throw '.NET runtime was not included'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Package portable ZIP and Windows installer
        shell: pwsh
        run: |
          $publishDir = (Get-Item release-assets/windows).FullName
          Compress-Archive `
            -Path "$publishDir\*" `
            -DestinationPath "release-assets/mensetsu-windows-x64-portable.zip"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DAppVersion=$version" app/desktop/windows/Mensetsu.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path 'release-assets/mensetsu-windows-x64-setup.exe')) {
            throw 'Windows installer was not produced'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: |
            release-assets/mensetsu-windows-x64-portable.zip
            release-assets/mensetsu-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned macOS desktop client
        run: |
          xcodebuild -project app/desktop/macos/Mensetsu.xcodeproj \
            -scheme Mensetsu \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/mensetsu-macos" \
            build
          mkdir -p release-assets
          tar -czf release-assets/mensetsu-macos-unsigned.tar.gz \
            -C "$RUNNER_TEMP/mensetsu-macos/Build/Products/Release" Mensetsu.app
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: release-assets/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test Android client
        run: |
          chmod +x app/mobile/android/gradlew
          app/mobile/android/gradlew \
            -p app/mobile/android testDebugUnitTest assembleDebug
      - name: Package installable Android test APK
        run: |
          mkdir -p release-assets
          cp app/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            release-assets/mensetsu-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: release-assets/*
          if-no-files-found: error

  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS simulator client
        run: |
          xcodebuild -project app/mobile/ios/Mensetsu.xcodeproj \
            -scheme Mensetsu \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/mensetsu-ios" build
          mkdir -p release-assets
          ios_products="$RUNNER_TEMP/mensetsu-ios/Build/Products/Release-iphonesimulator"
          tar -czf release-assets/mensetsu-ios-simulator-unsigned.tar.gz \
            -C "$ios_products" Mensetsu.app
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish native client preview release
        uses: softprops/action-gh-release@v2
        with:
          name: Mensetsu native preview ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Native client preview builds for `${{ github.ref_name }}`.

            - Android is a debug-signed APK for direct testing, not a Play
              Store release.
            - iOS is an unsigned simulator app; it cannot be installed on a
              physical device.
            - macOS is unsigned and may be blocked by Gatekeeper.
            - Windows provides a portable ZIP and a setup installer; both are unsigned.
            - Linux is a binary tarball; GTK 4 and libsecret runtime packages
              are required.
          files: release-assets/*
