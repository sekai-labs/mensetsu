name: Native clients

on:
  push:
    paths:
      - 'app/mobile/android/**'
      - 'app/mobile/ios/**'
      - 'app/desktop/**'
      - 'contracts/**'
      - 'server/**'
      - '.github/workflows/native-clients.yml'
  pull_request:
    paths:
      - 'app/mobile/android/**'
      - 'app/mobile/ios/**'
      - 'app/desktop/**'
      - 'contracts/**'
      - 'server/**'
      - '.github/workflows/native-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MENSETSU_API_URL: ${{ vars.NATIVE_SMOKE_API_URL }}

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android APK
        run: |
          chmod +x app/mobile/android/gradlew
          if ! app/mobile/android/gradlew -p app/mobile/android testDebugUnitTest assembleDebug > "$RUNNER_TEMP/android-build.log" 2>&1; then
            grep -E 'FAILURE:|What went wrong:|Execution failed|A failure occurred|Android resource linking failed|error:|^e: ' "$RUNNER_TEMP/android-build.log" | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::$(tail -n 1 "$RUNNER_TEMP/android-build.log")"
            exit 1
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Require a reachable Rust API
        if: env.MENSETSU_API_URL != ''
        shell: bash
        run: |
          curl --fail --silent --show-error "$MENSETSU_API_URL/health/live"
      - name: Run real emulator UI smoke
        if: env.MENSETSU_API_URL != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb push fixtures/resume-text.pdf /sdcard/Download/resume-text.pdf
            app/mobile/android/gradlew -p app/mobile/android connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.API_BASE_URL="$MENSETSU_API_URL"

  ios:
    runs-on: macos-15
    env:
      MENSETSU_API_BASE_URL: ${{ vars.NATIVE_SMOKE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator app
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0]')"
          test -n "$simulator_id" && test "$simulator_id" != null
          derived_data="$RUNNER_TEMP/mensetsu-ios"
          if ! xcodebuild build-for-testing -project app/mobile/ios/Mensetsu.xcodeproj -scheme Mensetsu -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO -derivedDataPath "$derived_data" > "$RUNNER_TEMP/ios-build.log" 2>&1; then
            grep -E 'error:|fatal error:|^e: ' "$RUNNER_TEMP/ios-build.log" | tail -n 8 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::$(tail -n 1 "$RUNNER_TEMP/ios-build.log")"
            exit 1
          fi
          mkdir -p build/ios
          tar -czf build/ios/Mensetsu-ios-simulator.app.tar.gz -C "$derived_data/Build/Products/Debug-iphonesimulator" Mensetsu.app
      - name: Upload iOS simulator app archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/Mensetsu-ios-simulator.app.tar.gz
          if-no-files-found: error
      - name: Require a reachable Rust API
        if: env.MENSETSU_API_URL != ''
        run: |
          curl --fail --silent --show-error "$MENSETSU_API_URL/health/live"
      - name: Run real XCUITest UI smoke
        if: env.MENSETSU_API_URL != ''
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0]')"
          test -n "$simulator_id" && test "$simulator_id" != null
          derived_data="$RUNNER_TEMP/mensetsu-ios"
          if ! xcrun simctl list devices booted -j | jq -e --arg id "$simulator_id" '.devices[][] | select(.udid == $id)' >/dev/null; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" "$derived_data/Build/Products/Debug-iphonesimulator/Mensetsu.app"
          app_data="$(xcrun simctl get_app_container "$simulator_id" app.mensetsu.ios data)"
          mkdir -p "$app_data/Documents"
          cp fixtures/resume-text.pdf "$app_data/Documents/resume-text.pdf"
          xctestrun="$(find "$derived_data/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$xctestrun"
          xcodebuild test-without-building -xctestrun "$xctestrun" -destination "platform=iOS Simulator,id=$simulator_id"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and Secret Service dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libsecret-1-dev libglib2.0-dev pkg-config xvfb xauth dbus-x11 gnome-keyring
      - name: Build GTK4 native client
        run: |
          cargo build --release --manifest-path app/desktop/linux/Cargo.toml
          mkdir -p build/linux/mensetsu-linux
          cp app/desktop/linux/target/release/mensetsu-linux build/linux/mensetsu-linux/
          tar -czf build/linux/mensetsu-linux-x86_64.tar.gz -C build/linux/mensetsu-linux mensetsu-linux
      - name: Upload Linux binary bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-bin
          path: build/linux/mensetsu-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Require a reachable Rust API
        if: env.MENSETSU_API_URL != ''
        run: |
          curl --fail --silent --show-error "$MENSETSU_API_URL/health/live"
      - name: Launch and exercise GTK4 UI against Rust API
        if: env.MENSETSU_API_URL != ''
        run: dbus-run-session -- bash -c 'printf "native-smoke-secret\n" | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a cargo test --manifest-path app/desktop/linux/Cargo.toml --test smoke_test -- --nocapture --test-threads=1'

  macos:
    runs-on: macos-15
    env:
      MENSETSU_TEST_PDF_PATH: ${{ github.workspace }}/fixtures/resume-text.pdf
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned macOS app
        run: |
          if ! xcodebuild -project app/desktop/macos/Mensetsu.xcodeproj -scheme Mensetsu -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/mensetsu-macos" build > "$RUNNER_TEMP/macos-build.log" 2>&1; then
            grep -E 'error:|Error Domain|failed|Failure' "$RUNNER_TEMP/macos-build.log" | tail -n 12 | while IFS= read -r line; do echo "::error::$line"; done || true
            echo "::error::$(tail -n 1 "$RUNNER_TEMP/macos-build.log")"
            exit 1
          fi
          mkdir -p build/macos
          tar -czf build/macos/Mensetsu-macos-unsigned.app.tar.gz -C "$RUNNER_TEMP/mensetsu-macos/Build/Products/Debug" Mensetsu.app
      - name: Upload unsigned macOS app archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-app
          path: build/macos/Mensetsu-macos-unsigned.app.tar.gz
          if-no-files-found: error
      - name: Require a reachable Rust API
        if: env.MENSETSU_API_URL != ''
        run: |
          curl --fail --silent --show-error "$MENSETSU_API_URL/health/live"
      - name: Exercise macOS SwiftUI UI against Rust API
        if: env.MENSETSU_API_URL != ''
        run: xcodebuild test -project app/desktop/macos/Mensetsu.xcodeproj -scheme Mensetsu -destination 'platform=macOS'

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Build unpackaged WinUI 3 client
        shell: pwsh
        run: |
          $buildLog = "$env:RUNNER_TEMP\mensetsu-windows-build.log"
          msbuild app/desktop/windows/Mensetsu.sln /restore /p:Platform=x64 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path $buildLog -Pattern 'error' | Select-Object -Last 12 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishDir = (New-Item -ItemType Directory -Force -Path build/windows/publish).FullName
          $publishLog = "$env:RUNNER_TEMP\mensetsu-windows-publish.log"
          msbuild app/desktop/windows/src/Mensetsu/Mensetsu.csproj /restore /target:Publish /p:Platform=x64 /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true "/p:PublishDir=$publishDir/" 2>&1 | Tee-Object -FilePath $publishLog
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path $publishLog -Pattern 'error' | Select-Object -Last 12 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
          if (-not (Test-Path (Join-Path $publishDir 'Mensetsu.exe'))) { throw 'WinUI executable not published' }
          if (-not (Test-Path (Join-Path $publishDir 'coreclr.dll'))) { throw '.NET runtime not included in published app' }
      - name: Package Windows executable and dependencies
        shell: pwsh
        run: |
          $publishDir = (Get-Item build/windows/publish).FullName
          Compress-Archive -Path "$publishDir\*" -DestinationPath build/windows/mensetsu-win-x64.zip
      - name: Upload Windows package archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bin
          path: build/windows/mensetsu-win-x64.zip
          if-no-files-found: error
      - name: Require a reachable Rust API
        if: env.MENSETSU_API_URL != ''
        shell: pwsh
        run: |
          Invoke-WebRequest "$env:MENSETSU_API_URL/health/live" -UseBasicParsing | Out-Null
      - name: Launch and exercise WinUI UI against Rust API
        if: env.MENSETSU_API_URL != ''
        shell: pwsh
        run: |
          $env:MENSETSU_APP_EXE = (Get-Item build/windows/publish/Mensetsu.exe).FullName
          $env:MENSETSU_TEST_PDF_PATH = "$((Get-Item .).FullName)\fixtures\resume-text.pdf"
          dotnet test app/desktop/windows/tests/Mensetsu.AutomationSmoke/Mensetsu.AutomationSmoke.csproj --no-build -p:Platform=x64
